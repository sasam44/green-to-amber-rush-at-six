<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green to Amber: Rush at Six</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1b2d3c;
    user-select: none;
    -webkit-user-select: none;
  }
  #webgl, #hud {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #webgl { z-index: 1; }
  #hud { z-index: 2; cursor: default; }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="webgl" aria-hidden="true"></canvas>
<canvas id="hud" aria-label="Green to Amber: Rush at Six — 3D free-route city race across six traffic-light gates to beat the taxi meter"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
